name: loebeapp

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: loebeapp
      POSTGRES_USER: loebeapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
